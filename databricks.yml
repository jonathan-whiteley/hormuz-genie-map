bundle:
  name: hormuz_genie_map

variables:
  catalog:
    description: Unity Catalog catalog for all tables (required, no default)
  schema:
    description: Schema for all tables (create it first; see README)
    default: hormuz
  schedule_pause_status:
    description: PAUSED or UNPAUSED for the daily reference job and the hourly AIS sampler
    default: PAUSED
  bbox:
    description: Region as lat_min,lon_min,lat_max,lon_max
    default: "12,32,31,62"
  secret_scope:
    description: Secret scope holding the aisstream.io key
    default: hormuz
  warehouse_id:
    description: SQL warehouse for the app
  genie_space_id:
    description: Genie space id printed by genie/build_space.py; the placeholder none leaves Genie off (first deploy)
    default: none

include:
  - resources/*.yml

sync:
  exclude:
    - "app/node_modules/**"
    - "app/dist/**"
    - "app/client/dist/**"

targets:
  demo:
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
